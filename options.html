<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradingView Shortcuts</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" width="36" height="36" alt="">
      <div>
        <h1>TradingView Shortcuts</h1>
        <p>Click a key box, then press the keys you want. Changes apply to open TradingView tabs right away.</p>
      </div>
    </div>
    <label class="switch" title="Turn all shortcuts on or off">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">Enabled</span>
    </label>
  </header>

  <section class="controls">
    <input type="search" id="filter" placeholder="Search tools…" autocomplete="off">
    <label class="check"><input type="checkbox" id="onlyAssigned"> Assigned only</label>
    <label class="check"><input type="checkbox" id="toggleBack"> Pressing a shortcut again goes back to the cursor</label>
  </section>

  <p class="summary" id="summary"></p>
  <main id="groups"></main>

  <footer>
    <span>Runs only on tradingview.com. Shortcuts are ignored while you're typing in a text field.</span>
    <button type="button" id="reset" class="ghost">Reset to defaults</button>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="tools.js"></script>
  <script src="options.js"></script>
</body>
</html>
